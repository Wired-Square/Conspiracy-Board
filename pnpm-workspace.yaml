# esbuild's postinstall links its platform-native binary; Vite cannot run without it.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@wired-square/kit@0.4.0'
  - '@wired-square/canvas@0.1.0'
  - '@wired-square/store@0.1.0'
  - '@wired-square/tokens@0.5.0'
  - '@wired-square/icons@0.1.1'
