name: Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — leaving it in place."
          else
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "Conspiracy ${{ github.ref_name }}" \
              --generate-notes
          fi

  build:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read the wslib crates from the registry mirror
        shell: bash
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          cat .cargo/mirror.toml >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for signing credentials
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No APPLE_CERTIFICATE secret set — building unsigned (Gatekeeper will warn on launch)."
          fi

      - name: Import Apple certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
          echo "--- Code-signing identities in the CI keychain ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      - name: Set notarisation credentials
        if: steps.signing.outputs.enabled == 'true' && vars.APPLE_NOTARISE == 'true'
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPLE_PASSWORD=${{ secrets.APPLE_NOTARY_PASSWORD }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV

      - name: Build Tauri app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm build --target ${{ matrix.target }} --bundles dmg

      - name: Name the dmg
        id: dmg
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="$RUNNER_TEMP/Conspiracy_${VERSION}_macOS_arm64.dmg"
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Attach the dmg to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: conspiracy-${{ matrix.target }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
